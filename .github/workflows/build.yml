name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的tag时触发，如 v1.0.0
  workflow_dispatch:
    inputs:
      build_android:
        description: Build Android APK/AAB
        type: boolean
        default: true
      build_ios:
        description: Build iOS IPA
        type: boolean
        default: true
      build_web:
        description: Build Web zip
        type: boolean
        default: true
      build_windows:
        description: Build Windows zip
        type: boolean
        default: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.27.0'

jobs:
  build-android:
    if: github.event_name == 'push' || inputs.build_android
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整的 git 历史

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Create keystore file
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty."
            echo "::error::Encode your signing keystore file (the .jks / .keystore binary, NOT the password):"
            echo "::error::  Linux:  base64 -w0 upload-keystore.jks"
            echo "::error::  macOS:  base64 -i upload-keystore.jks | tr -d '\\n'"
            exit 1
          fi
          clean=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | tr '_-' '/+')
          echo "KEYSTORE_BASE64 length after cleanup: ${#clean} chars"
          if [ "${#clean}" -lt 100 ]; then
            echo "::error::KEYSTORE_BASE64 looks too short (${#clean} chars). You likely pasted the password or a file path — paste the base64 of the .jks file instead."
            exit 1
          fi
          # Repair missing padding (common when secrets are truncated or copied from URL-safe encoders).
          pad=$(( (4 - ${#clean} % 4) % 4 ))
          if [ "$pad" -ne 0 ]; then
            clean="${clean}$(printf '=%.0s' $(seq 1 "$pad"))"
            echo "Added $pad base64 padding character(s)."
          fi
          if ! printf '%s' "$clean" | base64 -d > android/app/upload-keystore.jks 2>/tmp/b64.err; then
            echo "::error::KEYSTORE_BASE64 is not valid base64: $(tr -d '\n' < /tmp/b64.err)"
            echo "::error::Re-encode the binary keystore and paste ONLY the base64 string into GitHub Secrets:"
            echo "::error::  Linux:  base64 -w0 upload-keystore.jks"
            echo "::error::  macOS:  base64 -i upload-keystore.jks | tr -d '\\n'"
            echo "::error::Verify locally: base64 -w0 upload-keystore.jks | base64 -d > /tmp/test.jks"
            exit 1
          fi
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "::error::Decoded keystore is empty after base64 decode."
            exit 1
          fi
          magic=$(od -An -tx1 -N4 android/app/upload-keystore.jks | tr -d ' \n')
          case "$magic" in
            feedfeed)
              echo "Detected JKS keystore."
              ;;
            3082*|3080*)
              echo "Detected PKCS12 keystore (OK — Gradle accepts this format)."
              ;;
            *)
              echo "::error::Decoded file is not a Java keystore (magic=$magic)."
              echo "::error::Encode the actual .jks / .keystore / .p12 binary — not a PEM text block, password, or certificate."
              exit 1
              ;;
          esac

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  build-ios:
    if: github.event_name == 'push' || inputs.build_ios
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整的 git 历史

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd build/ios/iphoneos/
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 app-release.ipa Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/app-release.ipa

  build-web:
    if: github.event_name == 'push' || inputs.build_web
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Web
        run: flutter build web --release

      - name: Package Web
        run: |
          cd build
          zip -r -9 ../lizunemu-web.zip web

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: lizunemu-web.zip

  build-windows:
    if: github.event_name == 'push' || inputs.build_windows
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Clean Windows CMake cache
        shell: pwsh
        run: |
          if (Test-Path build/windows) { Remove-Item -Recurse -Force build/windows }

      - name: Build Windows
        run: flutter build windows --release
        env:
          CMAKE_GENERATOR: Visual Studio 17 2022
          CMAKE_GENERATOR_PLATFORM: x64

      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath lizunemu-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: lizunemu-windows.zip

  upload:
    runs-on: ubuntu-latest
    needs: [ build-android, build-ios, build-web, build-windows ]
    if: ${{ always() && !cancelled() && (needs.build-web.result == 'success' || needs.build-ios.result == 'success' || needs.build-windows.result == 'success' || needs.build-android.result == 'success') }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整的 git 历史

      - name: Download Android artifacts
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: ./dist/

      - name: Download iOS artifacts
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ./dist/

      - name: Download Web artifacts
        if: needs.build-web.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ./dist/

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./dist/

      - name: List files
        run: tree dist

      - name: Prepare scripts
        run: chmod +x .github/scripts/process_commits.sh

      - name: Get Previous tag
        id: previoustag
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "tag=" >> $GITHUB_OUTPUT
            echo "is_first=true" >> $GITHUB_OUTPUT
          else
            echo "tag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT
            echo "is_first=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate commit messages
        id: commits
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=${{ steps.previoustag.outputs.tag }}
          DELIMITER="$(openssl rand -hex 16)"
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log "${CURRENT_TAG}" --pretty=format:"%s%n%b" | .github/scripts/process_commits.sh)
          else
            COMMITS=$(git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"%s%n%b" | .github/scripts/process_commits.sh)
          fi
          echo "commits<<${DELIMITER}" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "${DELIMITER}" >> $GITHUB_OUTPUT

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          draft: false
          make_latest: false
          allow_updates: true
          omit_body: false
          body: |
            ## 🚧 Pre-release Version

            ### 📋 Release Information
            **Version:** ${{ github.ref_name }}
            **Previous Version:** ${{ steps.previoustag.outputs.tag }}
            **Build Environment:** Flutter ${{ env.FLUTTER_VERSION }}

            ### 📝 Changelog
            ${{ steps.commits.outputs.commits }}

            ### 📦 Distribution
            | File | Description | Purpose |
            |------|-------------|----------|
            | `.apk` | Android Package | Direct installation for testing |
            | `.aab` | Android App Bundle | Google Play Store deployment |
            | `.ipa` | iOS App Archive | iOS device installation |
            | `lizunemu-web.zip` | Web build | Self-host or static hosting |
            | `lizunemu-windows.zip` | Windows desktop | Extract and run `lizunemu.exe` |

            ### 🔍 Additional Notes
            - This is a pre-release build intended for testing purposes
            - Features and functionality may not be fully stable
            - Not recommended for production use

            ### 📱 Compatibility
            - Minimum Android SDK: 21 (Android 5.0)
            - Target Android SDK: 33 (Android 13)
            - Web: modern Chromium / Firefox / Safari (self-host `lizunemu-web.zip`)
            - Windows: Windows 10+ x64 desktop (`lizunemu.exe` in `lizunemu-windows.zip`)

            > **Note:** Please report any issues or bugs through the GitHub issue tracker.
          files: |
            dist/flutter-apk/app-release.apk
            dist/bundle/release/app-release.aab
            dist/app-release.ipa
            dist/lizunemu-web.zip
            dist/lizunemu-windows.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts if not release
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: everything
          path: dist/
